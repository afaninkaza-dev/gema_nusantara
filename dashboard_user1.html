<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dashboard_user_history.css">
    <link rel="stylesheet" href="dashboard_user.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz@0,14..32;1,14..32&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,700;1,14..32,700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,700;1,14..32,500&display=swap');
        body {
            margin: 0;
            font-family: "Poppins"; 
            background-color: #FFFBE9;
            color: #000;
        }

        .sidebar {
            width: 200px;
            background-color: #fff;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
        }

        .logo {
            width: 70px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .logo img {
            margin-left: 0;
            width: 60px;
        }

        .logo p {
            font-size: 16px;
            line-height: 1em;
            font-weight: 600;
            color: #6D4A37;
            margin: 0;
        }

        .sidebar a {
            display: block;
            padding: 10px 0;
            text-decoration: none;
            color: #000;
            transition: color 0.3s ease;
            font-size: 15px;
            font-weight: 500;
            font-family: 'poppins';
        }

        .sidebar img {
            width: 130px;
            margin-left: 20px;
            margin-top: 10px;
            margin-bottom: 0;
        }

        .sidebar .edit-icon {
            position: absolute;
            bottom: 20px;
            left: 50%;
            margin-left: 25px;
            margin-bottom: 310px;
            background-color: #fff;
            border-radius: 50%;
            padding: 5px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transform: translateX(-50%);
        }

        .sidebar a {
            margin-left: 15px;
            justify-content: center;
        }

        .logout-button {
            margin-top: 40px;
            margin-left: 20px;
            font-weight: 200;
        }

        .rangkum_baca {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 30px;
        }

        .isi_rangkum, .grafik_baca, .lanjut_baca {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            padding: 0px 10px 10px 10px;
            background-color: #fff;
            border: 2px solid#cccaca;
            border-radius: 8px;
        }

        .isi_rangkum h2 {
            font-size: 15px;
        }

        .rangkum_detail {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .rangkum_detail img {
            width: 50px;
            height: 50px;
        }

        .rangkum_detail h3 {
            font-size: 45px;
            font-weight: 700;
            margin: 0;
        }

        .grafik_baca {
            display: flex;
            flex-direction: column;
            margin-bottom: 30px;
        }

        .grafik_baca img{
            height: 100%;
            max-width: 330px;
        }

        .lanjut_baca img {
            width: 120px;
            height: 100%;
        }

        .isi_baca {
            display: flex;
            flex-direction: row;
            gap: 20px;
        }

        .isi_baca h3 {
            margin: 0;
            font-size: 15px;
            font-weight: 500;
        }

        .baca_detail {
            display: flex;
            flex-direction: column;
        }

        .isi_detail {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: start;
            margin: 0;
            gap: 5px;
        }

        .isi_detail p {
            font-size: 10px;
            margin: 5px 0 5px 0;
        }

        .isi_detail img {
            width: 15px;
            height: 15px;
        }

        #star {
            color: rgb(255, 225, 0);
            font-size: 15px;
            margin: 0;
        }
    </style>
    <link rel="icon" href="logoweb.svg">
    <title>Gema Nusantara</title>
</head>

<body>
    <nav>
        <a href="landingpage.html"><img class="nav_logo" src="logoweb.svg" alt="Logo Gema Nusantara"> </a>
        <a href="dashboard_user.html"><img class="icon" id="active" src="icon1.svg"></a>
        <a href="dashboardsuka_user.html"><img class="icon" src="love.svg"></a>
        <a href="dashboardsimpan_user.html"><img class="icon" src="bookmark.svg"></a>
        <a href="dashboardulasan_user.html"><img class="icon" src="coment1.svg"></a>
        <a href="dashboardhistory_user.html"><img class="icon" src="history.svg"></a>
    </nav>

    <h1><span id="dashboard_header">Halo Rangga</span></h1>

    <section class="dashboard">

        <div class="dashboard_kiri">
            <div class="rangkum_baca">

                <div class="isi_rangkum">
                    <h2>Total Cerita Yang Sedang Dibaca</h2>
                    <div class="rangkum_detail">
                        <img src="book1.svg">
                        <h3>23</h3>
                    </div>
                </div>

                <div class="isi_rangkum">
                    <h2>Total Cerita Yang Selesai Dibaca</h2>
                    <div class="rangkum_detail">
                        <img src="book1.svg">
                        <h3>8</h3>
                    </div>
                </div>

            </div>

            <div class="cerita_container">

            </div>

        </div>

        <div class="dashboard_kanan">

            <div class="grafik_baca">
                <h2>Jumlah Membaca Perhari</h2>
                <img src="dashboard/grafik.png" alt="grafik batang jumlah membaca">
            </div>

            <div class="lanjut_baca">
                <h2>Lanjut Membaca</h2>
                <div class="isi_baca">
                    <img src="ceritatimun.png">
                    <div class="baca_detail">
                        <h3>Timun Mas</h3>

                        <div class="isi_detail">
                            <img src="dashboard/clock.svg">
                            <p>Terakhir dibaca : 18 - 11 - 2025</p>
                        </div>

                        <div class="isi_detail">
                            <p>4.5</p>
                            <p id="star">★★★★★</p>
                        </div>

                        <div class="isi_detail">
                            <img src="dashboard/people.svg">
                            <p>8.1K</p>
                        </div>

                        <div class="isi_detail">
                            <img src="dashboard/book_open.svg">
                            <p>Sisa 2 Bab</p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
