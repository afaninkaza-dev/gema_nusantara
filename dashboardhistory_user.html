<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dashboard_user_history.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz@0,14..32;1,14..32&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,700;1,14..32,700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,700;1,14..32,500&display=swap');
        body {
            margin: 0;
            font-family: "Poppins"; 
            background-color: #FFFBE9;
            color: #000;
        }

        nav {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            height:100vmax;
            background-color: #FEFDF7;
            display: flex;
            flex-direction: column;   
            max-width: fit-content;
            align-items: center;
            padding: 0px 5px;
            box-shadow: 0 0 10px #8d8a8a;
        }

        .nav_logo {
            margin-top: 20px;
            margin-bottom: 10px;
            width: 48px;
            height: 42px;
            
        }

        .icon {
            margin: 15px 6px;
            width: 25px;
            height: 25px;
        }

        #active {
            background-color: #6D4A37;
            padding: 5px 5px;
            border-radius: 10px;
            width: 25px;
            height: 25px;
        }

        #dashboard_header {
            margin: auto 50px auto 100px;
            display: flex;
            justify-content: center;
            font-family: 'poppins', sans-serif;
            font-size: 40px;
            font-weight: 400;
        }

        .history_container {
            margin: 20px 150px;
            display: flex;
            flex-direction: column;
            
        }

        h2 {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h2 span {
            background-color: #FEFDF7;
            margin: 0 25px 0 0;
        }

        h2:after {
            background: #6D4A36;
            height: 5px;
            content: "";
            flex: 1;
        }

        .history_wrapper {
            margin: 0 0 100px 0;
        }

        .cerita_container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 40px;
        }

        .cerita_wrapper {
            width: 180px;
            height: fit-content;
            padding: 15px;
            border-radius: 14px;
            background-color: #6D4A36;
            color: #F7F4E9;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .sampul {
            width: 100%;
            height: 220px;
            border-radius: 6px;
            object-fit: cover;
        }

        .cerita_wrapper h2 {
            margin: 0;
            font-weight: 600;
            font-size: 16px;
            height: 60px;
            display: flex;
            align-items: center;
        }

        .cerita_wrapper hr {
            margin: 0;
            border: none;
            border-top: 1px solid #F7F4E9;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .star {
            width: 18px;
            height: 18px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .rating_number {
            font-size: 16px;
            font-weight: 500;
            margin-right: auto;
        }

        .icon_small {
            width: 17px;
            height: 17px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .icon_small:hover, .star:hover {
            transform: scale(1.2);
        }
    </style>
    <link rel="icon" href="cr_wrapper/logo_web.png">
    <title>Gema Nusantara</title>
</head>

<body>
    <nav>
        <a href="landingpage.html"><img class="nav_logo" src="logoweb.svg" alt="Logo Gema Nusantara"> </a>
        <a href="dashboard_user.html"><img class="icon" src="icon1.svg"></a>
        <a href="dashboardsuka_user.html"><img class="icon" src="love.svg"></a>
        <a href="dashboardsimpan_user.html"><img class="icon" src="bookmark.svg"></a>
        <a href="dashboardulasan_user.html"><img class="icon" src="coment1.svg"></a>
        <a href="dashboardhistory_user.html"><img class="icon" id="active" src="historyputih.svg"></a>
    </nav>

    <h1><span id="dashboard_header">Riwayat Bacamu</span></h1>

    <div class="history_container">
        <div class="history_wrapper">
            <h2><span class="dashboard_header">Hari Ini</span></h2>

            <div class="cerita_container">
                <div class="cerita_wrapper">
                    <img class="sampul" src="cr_wrapper/cover_cr/rawa_pening.jpg" alt="Gambar Cerita Rawa Pening">
                    <h2>Rawa Pening</h2>
                    <span class="header_line">
                        <hr>
                    </span>
                    <div class="rating">
                        <img class="star" src="cr_wrapper/star.png" title="Rating 4.5">
                        <span class="rating_number">4.4</span>
                        <img class="icon_small" src="cr_wrapper/like.png" title="Favorite">
                        <img class="icon_small" src="cr_wrapper/icon.png" title="Share">
                    </div>
                </div>

                <div class="cerita_wrapper">
                    <img class="sampul" src="cr_wrapper/cover_cr/bawang.jpg"
                        alt="Gambar Cerita Bawang Putih & Bawang Merah">
                    <h2>Bawang Putih & Bawang Merah</h2>
                    <hr>
                    <div class="rating">
                        <img class="star" src="cr_wrapper/star.png" title="Rating 4.5">
                        <span class="rating_number">4.5</span>
                        <img class="icon_small" src="cr_wrapper/like.png" title="Favorite">
                        <img class="icon_small" src="cr_wrapper/icon.png" title="Share">
                    </div>
                </div>

                <div class="cerita_wrapper">
                    <img class="sampul" src="cr_wrapper/cover_cr/biwar_naga.jpg" alt="Gambar Cerita Biwar & Naga">
                    <h2>Biwar & Naga</h2>
                    <hr>
                    <div class="rating">
                        <img class="star" src="cr_wrapper/star.png" title="Rating 4.5">
                        <span class="rating_number">4.4</span>
                        <img class="icon_small" src="cr_wrapper/like.png" title="Favorite">
                        <img class="icon_small" src="cr_wrapper/icon.png" title="Share">
                    </div>
                </div>
            </div>

        </div>

        <div class="history_wrapper">
            <h2><span class="dashboard_header">Selasa, 18/11/2025</span></h2>

            <div class="cerita_container">

                <div class="cerita_wrapper">
                    <img class="sampul" src="cr_wrapper/cover_cr/si_kelingking.jpg" alt="Gambar Cerita Si Kelingking">
                    <h2>Si Kelingking</h2>
                    <hr>
                    <div class="rating">
                        <img class="star" src="cr_wrapper/star.png" title="Rating 4.5">
                        <span class="rating-number">4.4</span>
                        <img class="icon_small" src="cr_wrapper/like.png" title="Favorite">
                        <img class="icon_small" src="cr_wrapper/icon.png" title="Share">
                    </div>
                </div>

                <div class="cerita_wrapper">
                    <img class="sampul" src="cr_wrapper/cover_cr/bawang.jpg"
                        alt="Gambar Cerita Bawang Putih & Bawang Merah">
                    <h2>Bawang Putih & Bawang Merah</h2>
                    <hr>
                    <div class="rating">
                        <img class="star" src="cr_wrapper/star.png" title="Rating 4.5">
                        <span class="rating_number">4.5</span>
                        <img class="icon_small" src="cr_wrapper/like.png" title="Favorite">
                        <img class="icon_small" src="cr_wrapper/icon.png" title="Share">
                    </div>
                </div>

            </div>

        </div>
    </div>

</body>
