<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        height: 100vh;
        background-color: #F7F4E9;
    }

    .bagian-kiri {
        background-color: #F7F4E9;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .logo-container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .bagian-kanan {
        flex: 1;
        background-color: #fff;
        border-top-left-radius: 80px;
        border-bottom-left-radius: 80px;
        z-index: 1000;
    }

    .register {
        margin: 0 auto;
        text-align: center;
    }

    .logo {
        width: 380px;
    }

    .brand {
        color: #6b4226;
        font-weight: bolder;
        font-size: 43px;
        text-align: center;
    }

    .welcome h2 {
        font-size: 48px;
        font-weight: 600;
        margin-top: 60px;
        margin-bottom: 40px;
    }

    .welcome p {
        font-size: 16px;
        margin-bottom: 25px;
        text-align: center;
    }

    .kotak-input input {
        display: block;
        width: 70%;
        padding: 12px 18px;
        background-color: #fff;
        margin-left: 100px;
        margin-top: 10px;
        margin-bottom: 20px;
        color: #fff;
        border: 1px solid #6b4226;
        border-radius: 15px;
        font-size: 14px;
    }

    .search-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        right: 100px;
        transform: translateY(-50%); 
        width: 20px;
        height: 20px;
    }

    .logo-button {
        width: 31px;
        height: 31px;
        align-items: left;
    }

    .tombol-masuk button {
        width: 30%;
        background-color: #6b4226;
        color: white;
        border: 1px solid #fff;
        margin-top: 5px;
        margin-bottom: 20px;
        padding: 15px 20px;
        border-radius: 30px;
    }

    .tombol-masuk a {
        background-color: #6D4A36;
        color: white;
        text-decoration: none;
        font-weight: 500;
    }

    .tombol-daftar button:hover {
        background-color: #6b4226;
    }

    .daftar-dengan {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 25px;
        color: #000;
        font-size: 14px;
        gap: 10px;
    }

    .daftar-dengan::before,
    .daftar-dengan::after {
        content: "";
        flex: 1;
        height: 1px;
        background-color: #000;
    }

    .lupa {
        display: flex;
        align-items: right;
        justify-content: right;
        margin-right: 110px;
        margin-top: 20px;
        margin-bottom: 10px;
        color: #6b4226;
        font-weight: normal;
        font-size: 12px;
        cursor: pointer;
    }

    .sosmed {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 25px;
    }

    .sosmed img {
        width: 30px;
        height: 30px;
        cursor: pointer;
    }

    .belum {
        text-align: center;
        font-size: 14px;
        color: #000;
    }

    .belum a {
        color: #6b4226;
        text-decoration: none;
        font-weight: 500;
    }

    @media (max-width: 900px) {
        body {
            flex-direction: column;
            height: auto;
            min-height: 100vh;
        }

        .bagian-kiri {
            display: none;
        }

        .bagian-kanan {
            flex: 1;
            background-color: #fff;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            z-index: 1000;
            width: 100%;
            padding: 40px 20px;
        }

        .register {
            width: 100%;
            max-width: none;
        }

        .welcome h2 {
            font-size: 35px;
            font-weight: 600;
            margin-top: 40px;
            margin-bottom: 30px;
        }

        .welcome p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        .kotak-input input {
            width: 100%;
            max-width: 300px;
            margin: 10px auto;
        }

        .tombol-masuk button {
            width: 100%;
            max-width: 200px;
            background-color: #6b4226;
            color: white;
            border: 1px solid #fff;
            margin-top: 5px;
            margin-bottom: 20px;
            border-radius: 30px;
        }

        .tombol-masuk a {
            background-color: #6D4A36;
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .lupa {
            display: flex;
            align-items: right;
            justify-content: right;
            margin-right: 110px;
            margin-top: 20px;
            margin-bottom: 10px;
            color: #6b4226;
            font-weight: normal;
            font-size: 12px;
            cursor: pointer;
        }

        .sosmed {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .sosmed a {
            color: #fff;
        }

        .sosmed img {
            width: 30px;
            height: 30px;
            cursor: pointer;
        }

        .belum {
            text-align: center;
            font-size: 14px;
            color: #000;
        }

        .belum a {
            color: #6b4226;
            text-decoration: none;
            font-weight: 500;
        }
    }
</style>
</head>
<body>
    <div class="bagian-kiri">
        <div class="logo-container">
        <img src="logoweb.png" alt="Logo Gema Nusantara" class="logo img">
        <h1 class="brand">Gema Nusantara</h1>
        </div>
    </div>
    <div class="bagian-kanan">
        <div class="register">
            <div class="welcome">
                <h2>Masuk</h2>
            </div>
            <div class="kotak-input">
            <div class="input-container">
                <input type="text" placeholder="Masukkan email" />
            </div>
            <div class="input-container">
                <input type="password" placeholder="Masukkan kata sandi" />
            </div>
            </div>
            <p><a href="lupasandi.html" class="lupa">Lupa sandi?</a></p>
            <div class="tombol-masuk">
                <button><a href="landingpage.html" class="masuk">Masuk</a></button>
            </div>
            <div class="belum">
                <p>Belum memiliki akun? <a href="daftarakun.html" class="daftar">Daftar sekarang!</a></p>
            </div>
            <div class="daftar-dengan">Atau Daftar Dengan</div>
            <div class="sosmed">
                <a href="https://www.google.com"><img src="Google.png" alt="Google"></a>
                <a href="https://www.facebook.com"><img src="Facebook.png" alt="Facebook"></a>
            </div>
        </div>
    </div>
</body>
</html>
