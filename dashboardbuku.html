<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Akun Pengguna Web</title>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        integrity="YOUR_INTEGRITY_HASH" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    body {
        font-family: sans-serif;
        margin: 0;
        background-color: #f7f7f7;
    }

    .container {
        display: flex;
    }

    .sidebar {
        width: 80px;
        background-color: #fff;
        height: 110vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 40px;
        margin-bottom: 10px;
    }

    .sidebar .logo {
        margin-bottom: 10px;
    }

    .sidebar .logo img {
        width: 50px;
    }

    .sidebar nav ul {
        list-style: none;
        padding: 0;
    }

    .sidebar nav ul li {
        margin-bottom: 20px;
    }

    .sidebar nav ul li a {
        color: #000;
        font-size: 1.2em;
        display: block;
        padding: 8px;
        border-radius: 10px;
        transition: background-color 0.2s ease;
    }

    .sidebar nav ul li a.active {
        background-color: #000;
        color: #fff;
    }

    .main-content {
        flex: 1;
        padding: 20px;
    }

    .main-header {
        margin-bottom: 20px;
    }

    .main-header h1 {
        font-size: 2em;
        color: #333;
    }

    .search-bar {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        position: relative;
    }

    .search-bar input[type="text"] {
        padding: 10px;
        border: 1px solid #000;
        border-radius: 20px;
        width: 300px;
        padding-left: 15px;
    }

    .search-bar i.fas.fa-search {
        position: absolute;
        left: 9px;
        top: 50%;
        transform: translateY(-50%);
        color: #fff;
    }

    .search-bar button {
        position: absolute;
        left: 293px;
        top: 50%;
        transform: translateY(-50%);
        background-color: #000;
        color: #fff;
        border: none;
        width: 30px; 
        height: 30px; 
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0; 
    }

    .tambah button {
        padding: 8px 20px;
        background: #000;
        color: #fff;
        border-radius: 18px;
        margin-bottom: 10px;
        margin-left: 87%;
    }

    .user-table {
        width: 100%;
        border-collapse: collapse;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        background-color: #fff;
    }

    .user-table th,
    .user-table td {
        padding: 12px 15px;
        text-align: left;
        border-bottom: 1px solid #eee;
    }

    .user-table td img {
        width: 17%;
    }

    .user-table th {
        font-weight: bold;
        color: #555;
    }

    .user-table tbody tr:hover {
        background-color: #f9f9f9;
    }

    .user-table td a {
        color: #777;
        margin-right: 10px;
        transition: color 0.2s ease;
    }

    .user-table td a:hover {
        color: #333;
    }

    .page {
        margin-top: 20px;
        text-align: left;
    }

    .page a {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        padding: 8px 12px;
        margin: 0 5px;
        text-decoration: none;
        color: #000;
        border-radius: 4px;
        min-width: 20px;
        height: 20px;
    }

    .page a:hover {
        background-color: #000;
        color: #fff;
    }

    .page a.active {
        border-radius: 8px;
        background-color: #000;
        color: #fff;
        border-color: #000;
    }
    </style>
</head>

<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <img src="logoweb.svg" alt="Logo">
            </div>
            <nav>
                <ul>
                    <li><a href="#"><img src="home1.svg" alt="home"></a></li>
                    <li><a href="dashboardbuku.html" class="active"><img src="buku.svg" alt="book"></a></li>
                    <li><a href="dasboardwebadmin.html"><img src="icon1.svg" alt="User Icon"></a></li>
                    <li><a href="#"><img src="coment1.svg" alt="coment"></a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header class="main-header">
                <h1>Manajemen Akun Pengguna Web</h1>
            </header>
            <div class="search-bar">
                <input type="text" placeholder="Telusuri akun">
                <button><i class="fas fa-search"></i></button>
            </div>
            <div class="tambah button">
                <button>+ Tambah Cerita</button>
            </div>
            <table class="user-table">
                <thead>
                    <tr>
                        <th><input type="checkbox"></th>
                        <th>Sampul/Cover</th>
                        <th>Judul</th>
                        <th>Kode Buku</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="checkbox"></td>
                        <td><img src="ceritalutung.png"></td>
                        <td>Lutung Kasarung</td>
                        <td>GN-25-JAW-CR-0025</td>
                        <td>
                            <a href="#"><i class="fas fa-edit"></i></a>
                            <a href="#"><i class="fas fa-trash"></i></a>
                        </td>
                    </tr>
                    <tr>
                        <td><input type="checkbox"></td>
                        <td><img src="ceritatimun.png"></td>
                        <td>Timun Mas</td>
                        <td>GN-25-JAW-CR-0225</td>
                        <td>
                            <a href="#"><i class="fas fa-edit"></i></a>
                            <a href="#"><i class="fas fa-trash"></i></a>
                        </td>
                    </tr>
                    <tr>
                        <td><input type="checkbox"></td>
                        <td><img src="ceritatodilaling.png"></td>
                        <td>To Dilaling</td>
                        <td>GN-25-NTT-CR-0334</td>
                        <td>
                            <a href="#"><i class="fas fa-edit"></i></a>
                            <a href="#"><i class="fas fa-trash"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="page">
                <a class="active" href="#">1</a>
                <a href="#">2</a>
                <a href="#">3</a>
                <a href="#">...</a>
                <a href="#">36</a>
                <a href="#">37</a>
                <a href="#">&raquo;</a>
            </div>
        </main>
    </div>
</body>

</html>
